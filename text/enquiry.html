<br><br> <br><br>


 <!-- Placing Order Form-->
    <main style="max-width: 600px; margin: 0 auto; font-family: Playfair Display, sans-serif;">
        <section>
            <form action="index.html" method="get">
                <table border="0" cellpadding="10" cellspacing="0" width="100%">
                    <tr>
                        <td><b><label for="name">Full Names:</label></b></td>
                        <td><input type="text" id="name" name="name" required style="width:100%;" placeholder="Enter your full names"></td>
                    </tr>
                    <tr>
                        <td><b><label for="sname">Surname:</label></b></td>
                        <td><input type="text" id="sname" name="sname" required style="width:100%;" placeholder="Enter your surname"></td>
                    </tr>
                    <tr>
                        <td><b><label for="email">Email Address:</label></b></td>
                        <td><input type="email" id="email" name="email" required style="width:100%;" placeholder="Enter your email address"></td>
                    </tr>
                    <tr>
                        <td><b><label for="phone">Phone Number:</label></b></td>
                        <td><input type="tel" id="phone" name="phone" required style="width:100%;" placeholder="Enter your phone number"></td>
                    </tr>
                    <tr>
                        <td><b><label for="product">Select Choice:</label></b></td>
                        <td>
                            <select id="product" name="product" style="width:100%;">
                                <option value="celebration">Celebration Cakes</option>
                                <option value="themed">Themed Cakes</option>
                                <option value="biscuits">Biscuits </option>
                                <option value="cupcakes">Cupcakes</option>
                                <option value="scones">Fresh Scones </option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td valign="top"><b><label for="msg">Order Details:</label></b></td>
                        <td><textarea id="msg" name="msg" rows="5" style="width:100%;" placeholder="Provide details aboot flavors, sizes, custom text or specific dietary needs..."></textarea></td>
                    </tr>
                    <tr>
                        <td></td>
                        <td><input type="submit" value="Submit Custom Enquiry" style= " background-color: #FFB0C9; color: #7B3F00; padding: 10px 20px; font-weight: bold; border:none; border-radius:3px; cursor:pointer;"></td>
                    </tr>
                </table>
            </form>
        </section>
    </main>
