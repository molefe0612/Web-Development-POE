<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TS-lets Confectionary</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="fade-in-page">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--packed into one single row wrapper -->
    <header class="main-header">
        
        <!-- Logo & Brand Text Grouped Together -->
        <div style="display: flex; align-items: center; gap: 15px;">
            <!-- Circular Logo Box -->
            <div style="width: 50px; height: 50px; flex-shrink: 0; overflow: hidden; border-radius: 50%; border: 2px solid #FFB6C1;">
                <img src="../images/logo.jpg" alt="TS-lets Confectionary Logo" style="width: 100%; height: 100%; object-fit: cover; display: block;">
            </div>
            <!-- Brand Text Title Box -->
            <h1 class="brand-title">Ts lets confectionary</h1>
        </div>

        <!--Inline Navigation Menu and Button -->
        <nav class="links">
            <a href="about.html" target="_blank">About Us</a>
            <a href="products.html" target="_blank">Bakery Menu</a>
            <a href="contact.html" target="_blank">Contact Us</a>
            <a href="enquiry.html" target="_blank" class="order-action-link">Place Order</a>
        </nav>

    </header>

    <!-- Intro Text Section -->
    <center>
        <h2>Welcome to TS-Lets Confectionary!</h2>
        <p>We bake fresh cakes and custom treats daily with love and premium ingredients.</p>
    </center>
        
    </div>


    <!--  Dynamic Product Grid -->
    <div class="product-grid">
        <div class="product-card">
            <div class="image-zoom-box">
                <img src="../images/cake12.jpg" alt="Celebration Cakes">
            </div>
            
            <p class="product-title">Celebration Cakes</p>
        </div>

        <div class="product-card">
            <div class="image-zoom-box">
                <img src="../images/biscuit1.jpg" alt="Popular Biscuits">
            </div>
            <p class="product-title">Popular Biscuits</p>
        </div>

        <div class="product-card">
            <div class="image-zoom-box">
                <img src="../images/scones1.jpg" alt="Fresh Scones">
            </div>
            <p class="product-title">Fresh Scones</p>
        </div>
    </div>   

    <!-- FOOTER SECTION -->
    <footer class="main-footer">
        <hr class="footer-divider"> 
        <p>&copy; 2026 TS-lets Confectionary | Freshly Baked Daily</p>
    </footer>

</body>
</html>
